<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Sigma custom plugin: plot zip code boundaries on a map and lasso-select them" />
  <title>Zip Code Lasso 2</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.9.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="lasso-btn" type="button" title="Draw a lasso to select zip codes">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4.5 0-8 2.5-8 6 0 2.6 2 4.6 4.7 5.4-.3.5-.7 1-.7 1.6 0 1.2 1.3 2 2.8 2 .7 0 1.3-.2 1.8-.5"/><circle cx="9" cy="18" r="2"/></svg>
        <span>Lasso select</span>
      </button>
      <button id="clear-btn" type="button" title="Clear the current selection">Clear selection</button>
      <span id="status-text"></span>
    </div>
    <div id="map-wrap">
      <div id="map"></div>
      <svg id="lasso-svg">
        <polygon id="lasso-path"></polygon>
      </svg>
      <div id="empty-state" class="hidden">
        Configure this plugin: choose a data source and a zip code column in the editor panel.
      </div>
    </div>
    <div id="legend" class="hidden"></div>
  </div>

  <script src="https://unpkg.com/@turf/turf@7.4.0/turf.min.js"></script>
  <!-- @sigmacomputing/plugin's UMD build references the React global at load
       time even though this plugin never uses the React hooks API, so a
       real React build must be present before it loads. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js"></script>
  <script type="module" src="./app.debug.js"></script>
</body>
</html>
